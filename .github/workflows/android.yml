name: Android

# Chạy tay từ tab Actions, hoặc tự chạy khi đẩy một tag dạng v1.0.0.
on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Kênh nộp lên Play (bỏ trống = chỉ build, không nộp)'
        required: false
        default: ''
        type: choice
        options: ['', internal, alpha, beta, production]
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest

    # Khai ở cấp job chứ không phải cấp bước: biểu thức `if` của một bước được
    # tính trước khi `env` của chính bước đó có hiệu lực.
    env:
      PLAY_SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4

      - run: npm ci

      - name: Dựng bản web và đồng bộ sang Android
        run: |
          npm run build
          npx cap sync android

      # gradle.properties có trỏ org.gradle.java.home vào JDK trên máy Windows
      # của tác giả. Trên máy chủ Linux đường dẫn đó không tồn tại nên phải bỏ đi,
      # để Gradle dùng JDK do setup-java cài.
      - name: Bỏ đường dẫn JDK riêng của máy tác giả
        run: sed -i '/^org\.gradle\.java\.home=/d' android/gradle.properties

      - name: Ghi khoá ký
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::Chưa có ANDROID_KEYSTORE_BASE64 — sẽ ra bản CHƯA KÝ, không nộp lên Play được."
            exit 0
          fi
          # Chuỗi dán tay hay dính rác: xuống dòng kiểu Windows, khoảng trắng,
          # hoặc dòng "-----BEGIN..." nếu lỡ dùng certutil. Phải dọn sạch trước
          # khi giải mã — `base64 -d` gặp một ký tự lạ là hỏng cả chuỗi.
          printf '%s' "$KEYSTORE_B64" | grep -v -- '-----' | tr -d '\r\n \t' > ks.b64
          echo "Chuỗi sau khi dọn: $(wc -c < ks.b64) ký tự"

          if ! base64 -d ks.b64 > android/upload-key.jks 2> b64.err; then
            # Soi xem chuỗi hỏng ở đâu. Chỉ in ra đặc điểm — độ dài, ký tự lạ,
            # vị trí — chứ không in nội dung, để không lộ khoá ra log.
            bad=$(tr -d 'A-Za-z0-9+/=' < ks.b64 | wc -c)
            pos=$(grep -bo -m1 '[^A-Za-z0-9+/=]' ks.b64 | head -1 | cut -d: -f1)
            echo "::error::ANDROID_KEYSTORE_BASE64 không giải mã được. $(cat b64.err)"
            echo "Chẩn đoán: dài $(wc -c < ks.b64) ký tự (đúng phải khoảng 5836)."
            echo "           có $bad ký tự nằm ngoài bảng chữ cái base64${pos:+, cái đầu tiên ở vị trí $pos}."
            echo ""
            echo "Gần như chắc chắn bạn đã dán nhầm nội dung tệp .jks (đoạn ký tự loạn xạ"
            echo "nhìn thấy khi mở bằng Notepad) thay vì chuỗi base64."
            echo ""
            echo "Cách lấy đúng chuỗi: chạy trên máy bạn"
            echo "  cd D:\\123"
            echo "  node scripts/xuat-base64.mjs"
            echo "rồi mở tệp ANDROID_KEYSTORE_BASE64.txt nó tạo ra, Ctrl+A Ctrl+C, dán lại secret."
            exit 1
          fi

          size=$(stat -c%s android/upload-key.jks)
          magic=$(head -c 2 android/upload-key.jks | od -An -tx1 | tr -d ' \n')
          echo "Tệp khoá: $size bytes, 2 byte đầu: $magic"
          if [ "$size" -lt 1000 ] || [ "$magic" != "3082" ]; then
            echo "::error::Giải mã ra tệp không phải keystore (cần từ 1000 bytes trở lên, 2 byte đầu phải là 3082)."
            echo "Nhiều khả năng chuỗi bị dán thiếu. Chuỗi đúng dài khoảng 5836 ký tự."
            exit 1
          fi

          # Thử mở khoá ngay tại đây. Sai mật khẩu hay sai alias thì báo rõ ràng,
          # thay vì để Gradle chết ở bước ký với thông báo khó hiểu.
          # keytool in lỗi ra stdout chứ không phải stderr, nên phải gộp cả hai
          # luồng lại; tách ra là mất sạch thông báo.
          trim() { printf '%s' "$1" | tr -d '\r\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//'; }

          PW_OK=""
          for variant in nguyen_van da_cat_khoang_trang; do
            if [ "$variant" = nguyen_van ]; then TRY="$STORE_PASSWORD"; else TRY="$(trim "$STORE_PASSWORD")"; fi
            if keytool -list -keystore android/upload-key.jks -storepass "$TRY" > kt.out 2>&1; then
              PW_OK="$TRY"
              [ "$variant" = da_cat_khoang_trang ] && \
                echo "::warning::Mật khẩu trong secret có thừa khoảng trắng hoặc ký tự xuống dòng ở đầu/cuối. Đã tự cắt bỏ, nhưng nên sửa lại secret cho sạch."
              break
            fi
          done

          if [ -z "$PW_OK" ]; then
            echo "::error::Sai mật khẩu — không mở được kho khoá."
            echo "keytool báo: $(grep -i 'error\|exception' kt.out | head -2)"
            echo ""
            echo "ANDROID_STORE_PASSWORD phải đúng bằng mật khẩu bạn gõ lúc chạy"
            echo "scripts/tao-keystore.mjs. Script có in mật khẩu đó ra màn hình sau khi tạo."
            echo "Nếu không nhớ nữa thì không đọc lại được — phải xoá tệp khoá cũ và tạo khoá mới."
            exit 1
          fi

          ALIAS=$(trim "$KEY_ALIAS")
          if ! grep -qi "^${ALIAS}," kt.out; then
            echo "::error::Mở được kho khoá nhưng không có alias '${ALIAS}' bên trong."
            echo "Các alias thật sự có trong kho:"
            grep -iE 'PrivateKeyEntry|SecretKeyEntry|trustedCertEntry' kt.out | sed 's/^/  /'
            echo "Sửa secret ANDROID_KEY_ALIAS cho khớp (script tạo khoá dùng alias: upload)."
            exit 1
          fi
          echo "Khoá hợp lệ, mật khẩu và alias '${ALIAS}' đều khớp."

          cat > android/keystore.properties <<EOF
          storeFile=upload-key.jks
          storePassword=$PW_OK
          keyAlias=$ALIAS
          keyPassword=$(trim "$KEY_PASSWORD")
          EOF

      - name: Build AAB và APK
        working-directory: android
        # Cờ thực thi của gradlew được đặt trong git (100755), nhưng đặt lại ở
        # đây cho chắc — chỉ cần một lần `cap add android` chạy trên Windows là
        # tệp mất cờ và cả bản dựng chết với "Permission denied".
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon

      # Bản chưa ký vẫn build trót lọt và vẫn tải về được, chỉ tới lúc nộp lên
      # Play mới bị chặn. Kiểm ngay tại đây cho khỏi mất công.
      - name: Xác nhận bản dựng đã được ký
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          if unzip -l "$AAB" | grep -qE 'META-INF/.*\.(RSA|EC|DSA)'; then
            echo "AAB đã được ký."
          else
            echo "::warning::AAB CHƯA ĐƯỢC KÝ — Play sẽ từ chối. Kiểm tra lại 4 secret."
          fi

      # Số hiệu bản dựng lấy theo số thứ tự lần chạy để mỗi lần nộp đều tăng,
      # khỏi phải sửa tay versionCode trong build.gradle.
      - name: Đặt tên tệp
        id: name
        run: echo "tag=${GITHUB_REF_NAME//\//-}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v5
        with:
          name: android-${{ steps.name.outputs.tag }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # Chỉ nộp khi bạn chọn kênh và đã nạp khoá tài khoản dịch vụ.
      - name: Nộp lên Google Play
        if: ${{ inputs.track != '' && env.PLAY_SA != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.lamlestudio.countingshadow
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: ${{ inputs.track == 'production' && 'draft' || 'completed' }}
